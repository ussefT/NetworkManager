name: Build and release Network Manager

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GTK4 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check code
        run: cargo check --locked

      - name: Run Clippy
        run: cargo clippy --locked

      - name: Run tests
        run: cargo test --locked

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            asset_arch: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            asset_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GTK4 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package portable Linux archive
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          TARGET: ${{ matrix.target }}
        run: |
          package_dir="dist/network-manager"
          mkdir -p "$package_dir"
          install -m 755 "target/$TARGET/release/my-gtk-app" "$package_dir/network-manager"
          cat > "$package_dir/README.txt" <<EOF
          Network Manager 0.1.0 - Linux $ASSET_ARCH

          Run portably from this directory:
            ./network-manager

          To install for the current user:
            install -Dm755 network-manager "\$HOME/.local/bin/network-manager"

          Runtime requirements:
          - A Linux $ASSET_ARCH system with glibc 2.35 or newer and compatible GTK4 runtime libraries.
          - A desktop session with a supported system tray/status notifier.

          This archive contains the executable, not GTK4 or other system libraries.
          EOF
          tar -czf "dist/network-manager-0.1.0-linux-$ASSET_ARCH.tar.gz" -C dist network-manager

      - name: Package Debian installer
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
          TARGET: ${{ matrix.target }}
        run: |
          package_dir="dist/deb-root"
          install -Dm755 "target/$TARGET/release/my-gtk-app" "$package_dir/usr/bin/network-manager"
          install -Dm644 /dev/null "$package_dir/DEBIAN/control"
          cat > "$package_dir/DEBIAN/control" <<EOF
          Package: network-manager
          Version: 0.1.0
          Section: net
          Priority: optional
          Architecture: $DEB_ARCH
          Depends: libc6 (>= 2.35), libgtk-4-1
          Maintainer: Network Manager contributors <network-manager@localhost>
          Description: GTK4 network activity monitor
           Displays network interface activity in a desktop dashboard and system tray.
          EOF
          dpkg-deb --build --root-owner-group "$package_dir" "dist/network-manager_0.1.0_${DEB_ARCH}.deb"

      - name: Upload architecture packages
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_arch }}
          path: |
            dist/network-manager-0.1.0-linux-${{ matrix.asset_arch }}.tar.gz
            dist/network-manager_0.1.0_${{ matrix.deb_arch }}.deb
          if-no-files-found: error
          retention-days: 7

  build-i386:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build 32-bit x86 in native i386 environment
        run: |
          docker run --rm --platform linux/386 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            i386/ubuntu:22.04 \
            bash -s <<'SCRIPT'
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y build-essential pkg-config libgtk-4-dev curl ca-certificates
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          cargo build --release --locked --target i686-unknown-linux-gnu
          SCRIPT

      - name: Package 32-bit x86 releases
        run: |
          package_dir="dist/network-manager"
          mkdir -p "$package_dir"
          install -m 755 target/i686-unknown-linux-gnu/release/my-gtk-app "$package_dir/network-manager"
          cat > "$package_dir/README.txt" <<'EOF'
          Network Manager 0.1.0 - Linux i686 (32-bit x86)

          Run portably from this directory:
            ./network-manager

          Runtime requirements:
          - A Linux i686 system with glibc 2.35 or newer and compatible GTK4 runtime libraries.
          - A desktop session with a supported system tray/status notifier.

          This archive contains the executable, not GTK4 or other system libraries.
          EOF
          tar -czf dist/network-manager-0.1.0-linux-i686.tar.gz -C dist network-manager

          package_dir="dist/deb-root"
          install -Dm755 target/i686-unknown-linux-gnu/release/my-gtk-app "$package_dir/usr/bin/network-manager"
          install -Dm644 /dev/null "$package_dir/DEBIAN/control"
          cat > "$package_dir/DEBIAN/control" <<'EOF'
          Package: network-manager
          Version: 0.1.0
          Section: net
          Priority: optional
          Architecture: i386
          Depends: libc6 (>= 2.35), libgtk-4-1
          Maintainer: Network Manager contributors <network-manager@localhost>
          Description: GTK4 network activity monitor
           Displays network interface activity in a desktop dashboard and system tray.
          EOF
          dpkg-deb --build --root-owner-group "$package_dir" dist/network-manager_0.1.0_i386.deb

      - name: Upload 32-bit x86 packages
        uses: actions/upload-artifact@v4
        with:
          name: release-i686
          path: |
            dist/network-manager-0.1.0-linux-i686.tar.gz
            dist/network-manager_0.1.0_i386.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, build-i386]
    runs-on: ubuntu-22.04
    steps:
      - name: Download architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.1.0
          target_commitish: ${{ github.sha }}
          name: Network Manager 0.1.0
          body: |
            Linux packages for x86_64 (amd64), ARM64 (arm64), and 32-bit x86
            (i686/i386):

            Each architecture has a `.deb` installer and a portable `.tar.gz`
            archive. Install Debian packages with `sudo apt install ./PACKAGE.deb`.
            Extract a portable archive and run `./network-manager`.

            Packages require glibc 2.35 or newer, compatible GTK4 runtime libraries,
            and a supported system tray/status notifier. The portable archives do not
            bundle system libraries.
          files: |
            dist/network-manager_0.1.0_*.deb
            dist/network-manager-0.1.0-linux-*.tar.gz
          overwrite_files: true
          make_latest: true
